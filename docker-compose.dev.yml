services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ai-resume-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-resume_analyzer}
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-apppassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network-dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-resume_analyzer}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ai-resume-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_dev:/data
    networks:
      - app-network-dev
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Setup
  minio-setup:
    image: minio/mc:latest
    container_name: ai-resume-minio-setup-dev
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - app-network-dev
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-resumes};
      exit 0;
      "

  # Application in development mode with hot reload
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-resume-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173" # Vite HMR port
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-appuser}:${DB_PASSWORD:-apppassword}@db:5432/${DB_NAME:-resume_analyzer}
      # JWT Authentication
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Gemini API Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # MinIO Configuration
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-resumes}
      MINIO_USE_SSL: false
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network-dev
    volumes:
      - ./:/app
      - /app/node_modules

networks:
  app-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
    driver: local
  minio_data_dev:
    driver: local
